version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # typescript-eslint (via eslint-config-next) rejects TS >= 7.0; revisit when it supports 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep Node types at or below the runtimes we deploy on (Vercel Node 24, Actions Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
